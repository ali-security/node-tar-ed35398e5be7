name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional tap test file(s) to run'
        required: false
        default: ''


jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.4.1]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- -c ${{ inputs.test-filter }}

      - name: Pack
        if: matrix.platform.os == 'ubuntu-latest' && matrix.node-version == '24.4.1'
        run: npm pack

      - name: Upload tarball
        if: matrix.platform.os == 'ubuntu-latest' && matrix.node-version == '24.4.1'
        uses: actions/upload-artifact@v4
        with:
          name: tar-tgz
          path: tar-*.tgz
          if-no-files-found: error
